general {
    ignore_empty_input = true
}

auth {
	fingerprint {
		enabled = true
	}
}

background {
    monitor =
    path = screenshot
	blur_passes = 2
}

input-field {
    monitor =
    size = 500, 70
    # colors match Hyprland borders / waybar / dunst: dark surface, cyan → green accent
    outline_thickness = 2
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    inner_color = rgba(21, 21, 21, 0.85)
    font_color = rgb(220, 220, 220)
    check_color = rgba(00ff99ee) rgba(33ccffee) 45deg  # while verifying
    fail_color = rgba(f53c3cee)
    fade_on_empty = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    position = 0, -80
    placeholder_text = $FPRINTPROMPT
    fail_text = $PAMFAIL$FPRINTFAIL
}

label {
    monitor =
    # keyboard layout, so the password isn't typed in the wrong one (Caps toggles)
    text = $LAYOUT[EN,FA]
    color = rgba(220, 220, 220, 1.0)
    font_size = 16
    font_family = HackNerdFont
    position = 0, -150
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    #clock
    text = cmd[update:1000] echo "$TIME"
    color = rgba(220, 220, 220, 1.0)
    font_size = 60
    font_family = HackNerdFont
    position = -100, 70
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = $USER
    color = rgba(220, 220, 220, 1.0)
    font_size = 30
    font_family = HackNerdFont
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}

image {
    monitor =
    path = ~/Pictures/mehdy.jpg
    size = 300 # lesser side if not 1:1 ratio
    rounding = -1 # negative values mean circle
    border_size = 4
    border_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    rotate = 0 # degrees, counter-clockwise
    reload_time = -1 # seconds between reloading, 0 to reload with SIGUSR2
#    reload_cmd =  # command to get new path. if empty, old path will be used. don't run "follow" commands like tail -F
    position = 0, 200
    halign = center
    valign = center
}
