# networkmanager_dmenu: Wi-Fi / VPN / connection menu, shown through rofi.
# Opened from the waybar network module (click) and SUPER+CTRL+W.
# Reference: https://github.com/firecat53/networkmanager-dmenu/blob/main/config.ini.example

[dmenu]
# Overrides on top of the rofi theme, for this menu only:
#  - no "Search" placeholder, so the password box just reads "Passphrase"
#  - monospace list font so the name / security / signal columns line up
# Avoid empty strings ("" / " ") in here: rofi then mis-parses the rest of it.
dmenu_command = rofi -i -theme-str 'entry { placeholder-color: transparent; } element-text { font: "Hack Nerd Font 11"; } listview { lines: 12; }'
highlight = True
# Blank line between sections (wired / Wi-Fi / actions)
compact = False
# Same signal icons as the waybar module
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {icon}  {name:<{max_len_name}}   {sec:<{max_len_sec}}  {signal:>3}%%
list_saved = False
prompt = Wi-Fi

[dmenu_passphrase]
obscure = True
show_pass = uwsm app -- alacritty --hold -e nmcli device wifi show-password

[editor]
terminal = uwsm app -- alacritty
gui_if_available = True
gui = uwsm app -- nm-connection-editor

[nmdm]
rescan_delay = 5
notification_timeout = 5
