[general]
live_config_reload = true

[env]
TERM = "alacritty"

[font]
size = 12.0

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.bold_italic]
family = "Hack Nerd Font"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[mouse]
hide_when_typing = true

[scrolling]
history = 100000
multiplier = 3

[window]
decorations = "full"
dynamic_padding = true
dynamic_title = true
opacity = 0.9
startup_mode = "Maximized"

[window.dimensions]
columns = 100
lines = 100

[window.padding]
x = 8
y = 8

# Palette matches Hyprland / waybar / dunst / rofi: dark surface, cyan → green accent
[colors.primary]
background = "#151515"
foreground = "#dcdcdc"

[colors.cursor]
text = "#151515"
cursor = "#33ccff"

[colors.selection]
text = "CellForeground"
background = "#1f4a5c"

[colors.search.matches]
foreground = "#151515"
background = "#ffb454"

[colors.search.focused_match]
foreground = "#151515"
background = "#00ff99"

[colors.normal]
black = "#2a2a2a"
red = "#f53c3c"
green = "#3ddc97"
yellow = "#ffb454"
blue = "#4d9fff"
magenta = "#c678dd"
cyan = "#33ccff"
white = "#b8b8b8"

[colors.bright]
black = "#6a6a6a"
red = "#ff6b6b"
green = "#00ff99"
yellow = "#ffcc80"
blue = "#7ab8ff"
magenta = "#d9a0ee"
cyan = "#7ae0ff"
white = "#f0f0f0"

