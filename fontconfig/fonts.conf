<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<!-- Persian/Arabic script: Vazirmatn. Latin fonts lack these glyphs, so
	     listing Vazirmatn right after them makes it the fallback for that script. -->
	<alias>
		<family>sans-serif</family>
		<prefer><family>Noto Sans</family><family>Vazirmatn</family></prefer>
	</alias>
	<alias>
		<family>serif</family>
		<prefer><family>Noto Serif</family><family>Vazirmatn</family></prefer>
	</alias>
	<alias>
		<family>monospace</family>
		<prefer><family>Noto Sans Mono</family><family>Vazirmatn</family></prefer>
	</alias>

	<!-- Text tagged as Persian (lang="fa", e.g. in browsers) gets Vazirmatn outright -->
	<match target="pattern">
		<test name="lang" compare="contains"><string>fa</string></test>
		<edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
	</match>
</fontconfig>
